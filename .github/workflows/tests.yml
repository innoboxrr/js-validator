name: Tests

# La definicion vive en innoboxrr/.github para que sea la misma en todo el
# ecosistema. Aqui solo se declara cuando corre.
on:
    push:
        branches: [master]
    pull_request:

jobs:
    tests:
        uses: innoboxrr/.github/.github/workflows/node-tests.yml@main
        # Vitest 5 exige Node ^22.12 || >=24 y Node 20 es EOL desde 2026-04-30:
        # se quita del conjunto por defecto del reutilizable (20, 22 y 24).
        with:
            node-versions: '["22", "24"]'
